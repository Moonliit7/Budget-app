<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #1c1c1e;
            --card-secondary: #2c2c2e;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --accent: #0a84ff;
            --green: #30d158;
            --red: #ff453a;
            --orange: #ff9f0a;
            --purple: #bf5af2;
            --border: #38383a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom)) 16px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 8px 0;
        }
        .header h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
        .date-badge { font-size: 13px; color: var(--text-sub); font-weight: 500; }

        /* Dashboard Overview Card */
        .hero-card {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hero-label { font-size: 13px; text-transform: uppercase; color: var(--text-sub); letter-spacing: 0.5px; font-weight: 600; }
        .hero-balance { font-size: 38px; font-weight: 800; margin: 6px 0 16px 0; letter-spacing: -1px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; }
        .stat-item { text-align: left; }
        .stat-val { font-size: 15px; font-weight: 700; margin-top: 2px; }

        /* Tabs Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0;
            z-index: 100;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-sub);
            font-size: 11px; font-weight: 500; display: flex;
            flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }

        /* Sections & Views */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Form Inputs */
        .form-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select, button {
            background: var(--card-secondary);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        /* List Styling */
        .section-title { font-size: 18px; font-weight: 700; margin: 20px 0 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .list-container { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .list-item:last-child { border-bottom: none; }
        .item-main { display: flex; align-items: center; gap: 12px; }
        .item-icon {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; background: var(--card-secondary);
        }
        .item-title { font-weight: 600; font-size: 15px; }
        .item-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
        .amount-pos { color: var(--green); font-weight: 700; }
        .amount-neg { color: var(--text-main); font-weight: 700; }

        /* Recurring Bills Specific */
        .bill-badge {
            font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; cursor: pointer;
        }
        .badge-pending { background: rgba(255, 159, 10, 0.15); color: var(--orange); }
        .badge-paid { background: rgba(48, 209, 88, 0.15); color: var(--green); }
        .del-btn { background: none; border: none; color: var(--red); font-size: 16px; padding: 0 0 0 10px; width: auto; }
        .freq-tag {
            font-size: 10px; font-weight: 600; color: var(--purple); background: rgba(191, 90, 242, 0.15);
            padding: 2px 6px; border-radius: 4px; margin-left: 6px; display: inline-block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Overview</h1>
        <div class="date-badge" id="currentDate">--</div>
    </div>

    <!-- HERO DASHBOARD -->
    <div class="hero-card">
        <div class="hero-label">Net Balance</div>
        <div class="hero-balance" id="netBalance">€0,00</div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <div class="hero-label" style="font-size: 10px;">Income</div>
                <div class="stat-val" style="color: var(--green);" id="totalIncome">€0,00</div>
            </div>
            <div class="stat-item">
                <div class="hero-label" style="font-size: 10px;">Expenses</div>
                <div class="stat-val" style="color: var(--red);" id="totalExpense">€0,00</div>
            </div>
            <div class="stat-item">
                <div class="hero-label" style="font-size: 10px;">Monthly Fixed</div>
                <div class="stat-val" style="color: var(--orange);" id="pendingBillsTotal">€0,00</div>
            </div>
        </div>
    </div>

    <!-- VIEW 1: TRANSACTIONS -->
    <div id="view-txns" class="view-section active">
        <div class="form-card">
            <div style="font-weight: 600; margin-bottom: 12px;">Add Transaction</div>
            <div class="form-row">
                <input type="text" id="txnTitle" placeholder="Title (e.g. Supermarket)" required>
                <input type="number" step="0.01" id="txnAmount" placeholder="Amount (€)" required>
            </div>
            <div class="form-row">
                <select id="txnCategory">
                    <option value="Groceries">🛒 Groceries</option>
                    <option value="Dining">🍽️ Dining & Bars</option>
                    <option value="Transport">🚘 Transport</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Salary">💰 Salary / Income</option>
                    <option value="Other">📦 Other</option>
                </select>
                <select id="txnType">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addTransaction()">Log Entry</button>
        </div>

        <div class="section-title">Recent Activity</div>
        <div class="list-container" id="txnList"></div>
    </div>

    <!-- VIEW 2: RECURRING BILLS -->
    <div id="view-bills" class="view-section">
        <div class="form-card">
            <div style="font-weight: 600; margin-bottom: 12px;">Add Recurring Bill</div>
            <div class="form-row">
                <input type="text" id="billTitle" placeholder="Bill Name (e.g. Rent, Energy)" required>
                <input type="number" step="0.01" id="billAmount" placeholder="Amount (€)" required>
            </div>
            <div class="form-row">
                <select id="billFrequency">
                    <option value="monthly">Monthly</option>
                    <option value="bimonthly">Bimonthly (Every 2 Mos)</option>
                    <option value="biweekly">Biweekly (Every 2 Wks)</option>
                    <option value="weekly">Weekly</option>
                    <option value="quarterly">Quarterly (Every 3 Mos)</option>
                    <option value="yearly">Yearly</option>
                </select>
                <select id="billCategory">
                    <option value="Housing">🏠 Housing & Utilities</option>
                    <option value="Subscriptions">📺 Subscriptions</option>
                    <option value="Insurance">🛡️ Insurance</option>
                    <option value="Internet">📶 Phone & Internet</option>
                </select>
            </div>
            <button class="btn-primary" style="background: var(--purple);" onclick="addBill()">Add Recurring Bill</button>
        </div>

        <div class="section-title">Recurring Commitments</div>
        <div class="list-container" id="billsList"></div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchView('txns', this)">
            <span class="nav-icon">💳</span>
            <span>Expenses</span>
        </button>
        <button class="nav-btn" onclick="switchView('bills', this)">
            <span class="nav-icon">📅</span>
            <span>Recurring Bills</span>
        </button>
    </div>

<script>
    // State Management
    let txns = JSON.parse(localStorage.getItem('eur_budget_txns')) || [];
    let bills = JSON.parse(localStorage.getItem('eur_budget_bills')) || [];

    // Currency Formatter for Euros
    const formatEUR = (num) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(num);

    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-GB', { month: 'short', day: 'numeric', year: 'numeric' });

    function switchView(viewName, btn) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`view-${viewName}`).classList.add('active');
        btn.classList.add('active');
    }

    // --- Transactions Logic ---
    function addTransaction() {
        const title = document.getElementById('txnTitle').value;
        const amount = parseFloat(document.getElementById('txnAmount').value);
        const category = document.getElementById('txnCategory').value;
        const type = document.getElementById('txnType').value;

        if (!title || isNaN(amount)) return;

        txns.unshift({ id: Date.now(), title, amount, category, type, date: new Date().toLocaleDateString('it-IT') });
        
        document.getElementById('txnTitle').value = '';
        document.getElementById('txnAmount').value = '';
        saveAndRender();
    }

    function deleteTxn(id) {
        txns = txns.filter(t => t.id !== id);
        saveAndRender();
    }

    // --- Recurring Bills Logic ---
    function addBill() {
        const title = document.getElementById('billTitle').value;
        const amount = parseFloat(document.getElementById('billAmount').value);
        const frequency = document.getElementById('billFrequency').value;
        const category = document.getElementById('billCategory').value;

        if (!title || isNaN(amount)) return;

        bills.push({ id: Date.now(), title, amount, frequency, category, status: 'pending' });
        
        document.getElementById('billTitle').value = '';
        document.getElementById('billAmount').value = '';
        saveAndRender();
    }

    function toggleBillStatus(id) {
        bills = bills.map(b => {
            if (b.id === id) {
                b.status = b.status === 'pending' ? 'paid' : 'pending';
            }
            return b;
        });
        saveAndRender();
    }

    function deleteBill(id) {
        bills = bills.filter(b => b.id !== id);
        saveAndRender();
    }

    // Convert frequency to monthly equivalent cost
    function getMonthlyEquivalent(amount, frequency) {
        switch (frequency) {
            case 'weekly': return amount * 4.33;
            case 'biweekly': return amount * 2.166;
            case 'monthly': return amount;
            case 'bimonthly': return amount / 2;
            case 'quarterly': return amount / 3;
            case 'yearly': return amount / 12;
            default: return amount;
        }
    }

    const frequencyLabels = {
        'weekly': 'Weekly',
        'biweekly': 'Biweekly',
        'monthly': 'Monthly',
        'bimonthly': 'Bimonthly',
        'quarterly': 'Quarterly',
        'yearly': 'Yearly'
    };

    const categoryIcons = {
        'Groceries': '🛒', 'Dining': '🍽️', 'Transport': '🚘', 'Shopping': '🛍️', 
        'Salary': '💰', 'Housing': '🏠', 'Subscriptions': '📺', 'Insurance': '🛡️', 
        'Internet': '📶', 'Other': '📦'
    };

    function saveAndRender() {
        localStorage.setItem('eur_budget_txns', JSON.stringify(txns));
        localStorage.setItem('eur_budget_bills', JSON.stringify(bills));
        render();
    }

    function render() {
        // Calculations
        let income = txns.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
        let expenses = txns.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
        
        // Calculate monthly fixed baseline across all frequencies
        let pendingBillsMonthlyEquiv = bills
            .filter(b => b.status === 'pending')
            .reduce((acc, b) => acc + getMonthlyEquivalent(b.amount, b.frequency), 0);

        document.getElementById('netBalance').textContent = formatEUR(income - expenses);
        document.getElementById('totalIncome').textContent = formatEUR(income);
        document.getElementById('totalExpense').textContent = formatEUR(expenses);
        document.getElementById('pendingBillsTotal').textContent = formatEUR(pendingBillsMonthlyEquiv);

        // Render Transactions List
        const txnEl = document.getElementById('txnList');
        txnEl.innerHTML = txns.length === 0 ? '<div style="padding:16px; text-align:center; color:var(--text-sub);">No logged activity</div>' : '';
        
        txns.forEach(t => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="item-main">
                    <div class="item-icon">${categoryIcons[t.category] || '📦'}</div>
                    <div>
                        <div class="item-title">${t.title}</div>
                        <div class="item-sub">${t.category} • ${t.date}</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="${t.type === 'income' ? 'amount-pos' : 'amount-neg'}">
                        ${t.type === 'income' ? '+' : '-'}${formatEUR(t.amount)}
                    </span>
                    <button class="del-btn" onclick="deleteTxn(${t.id})">✕</button>
                </div>
            `;
            txnEl.appendChild(div);
        });

        // Render Recurring Bills List
        const billsEl = document.getElementById('billsList');
        billsEl.innerHTML = bills.length === 0 ? '<div style="padding:16px; text-align:center; color:var(--text-sub);">No recurring bills set up</div>' : '';

        bills.forEach(b => {
            const monthlyEquiv = getMonthlyEquivalent(b.amount, b.frequency);
            const isNonMonthly = b.frequency !== 'monthly';
            
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="item-main">
                    <div class="item-icon">${categoryIcons[b.category] || '📅'}</div>
                    <div>
                        <div class="item-title">
                            ${b.title}
                            <span class="freq-tag">${frequencyLabels[b.frequency] || 'Monthly'}</span>
                        </div>
                        <div class="item-sub">
                            ${b.category} ${isNonMonthly ? `(~${formatEUR(monthlyEquiv)}/mo)` : ''}
                        </div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="text-align:right;">
                        <div style="font-weight:700;">${formatEUR(b.amount)}</div>
                        <span class="bill-badge ${b.status === 'paid' ? 'badge-paid' : 'badge-pending'}" onclick="toggleBillStatus(${b.id})">
                            ${b.status === 'paid' ? '✓ Paid' : '⏳ Pending'}
                        </span>
                    </div>
                    <button class="del-btn" onclick="deleteBill(${b.id})">✕</button>
                </div>
            `;
            billsEl.appendChild(div);
        });
    }

    render();
</script>
</body>
</html>
